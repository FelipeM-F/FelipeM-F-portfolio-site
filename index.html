<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio de desenvolvedor full stack">
    <meta name="theme-color" content="#1a1a2e">
    <title>Portfólio de Projetos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#home" id="nav-logo-name">Portfólio</a>
            </div>
            <ul class="nav-menu">
                <li><a href="#home" class="nav-link">Início</a></li>
                <li><a href="#about" class="nav-link">Sobre</a></li>
                <li><a href="#projects" class="nav-link">Projetos</a></li>
                <li><a href="#skills" class="nav-link">Habilidades</a></li>
                <li><a href="#contact" class="nav-link">Contato</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="stars"></div>
        <div class="hero-content">
            <h1 class="hero-title" id="profile-name"></h1>
            <p class="hero-subtitle" id="profile-role"></p>
            <p class="hero-description" id="profile-intro"></p>
            <div class="hero-buttons">
                <a href="#projects" class="btn btn-primary">Ver Projetos</a>
                <a href="#contact" class="btn btn-secondary">Entre em Contato</a>
            </div>
            <div class="social-links" id="social-links"></div>
        </div>

    </section>

    <section id="about" class="about">
        <div class="container">
            <h2>Sobre Mim</h2>
            <div class="about-content">
                <div class="about-text" id="about-text"></div>
                <div class="about-stats" id="about-stats"></div>
            </div>
        </div>
    </section>

    <section id="projects" class="projects">
        <div class="container">
            <h2>Projetos em Destaque</h2>
            <div class="projects-grid" id="projects-grid"></div>
        </div>
    </section>

    <section id="skills" class="skills">
        <div class="container">
            <h2>Habilidades Técnicas</h2>
            <div class="skills-grid" id="skills-grid"></div>
        </div>
    </section>

    <section id="contact" class="contact">
        <div class="container">
            <h2>Entre em Contato</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <h3 id="contact-heading"></h3>
                    <p id="contact-description"></p>
                    <div class="contact-methods" id="contact-methods"></div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p id="footer-copyright"></p>
            <div class="footer-links" id="footer-links"></div>
        </div>
    </footer>

    <script src="content.js"></script>
    <script src="script.js"></script>
</body>
</html>
